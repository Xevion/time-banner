[package]
name = "xtask"
description = "Asset pipeline tasks (font fetching) that don't belong in the compile graph"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
assert2.workspace = true
flate2 = { version = "1.1.9", features = ["zlib-rs"] }
ipnetwork = "0.21.1"
maxminddb = "0.30.0"
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10"
ureq = "3"
utz = { version = "0.4.1", default-features = false, features = ["balanced"] }
