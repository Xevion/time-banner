[package]
name = "time-banner"
version = "0.2.0"
edition = "2024"
description = "Dynamic SVG/PNG time banner service"
authors = ["Xevion <xevion@xevion.dev>"]
license = "MIT"
repository = "https://github.com/Xevion/time-banner"

[dependencies]
resvg = "0.45.1"
axum = "0.8.4"
http = "1.3"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.46", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15.7"
tera = "1.20.0"
timeago = "0.4.2"
phf = { version = "0.12.1", default-features = false }
chrono = "0.4.41"
regex = "1.11.1"
ico = "0.4.0"
thiserror = "2.0"
figment = { version = "0.10", features = ["env"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "compression-full"] }

[build-dependencies]
chrono = "0.4.41"
regex = "1.11.1"
phf = { version = "0.12.1", default-features = false }
phf_codegen = "0.12.1"
anyhow = "1.0"

[profile.dev-release]
inherits = "dev"
debug-assertions = false

