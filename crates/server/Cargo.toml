[package]
name = "time-banner"
description = "Dynamic SVG/PNG time banner service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "time-banner"
path = "src/main.rs"

[dependencies]
time-banner-core = { path = "../core" }
time-banner-render = { path = "../render" }
axum = "0.8.4"
http = "1.3"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.46", default-features = false, features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15.7"
thiserror = "2.0"
figment = { version = "0.10", features = ["env"] }
tower-http = { version = "0.7", features = ["trace", "timeout", "compression-full"] }
jiff = "0.2.35"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
