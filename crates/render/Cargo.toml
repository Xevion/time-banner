[package]
name = "time-banner-render"
description = "Templating, rasterization, and encoding pipeline for time-banner"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "time_banner_render"

[dependencies]
resvg = "0.48"
tera = "2"
timeago = "0.6"
serde = { version = "1.0", features = ["derive"] }
ico = "0.5"
png = "0.18"
thiserror = "2.0"
tracing = "0.1"
jiff = "0.2.35"

[dev-dependencies]
assert2.workspace = true
criterion = { version = "0.8.2", features = ["html_reports"] }
rstest.workspace = true

[[bench]]
name = "render"
harness = false
