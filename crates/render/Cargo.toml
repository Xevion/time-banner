[package]
name = "time-banner-render"
description = "Templating, rasterization, and encoding pipeline for time-banner"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "time_banner_render"

[dependencies]
resvg = { version = "0.48", default-features = false, features = ["text"] }
tera = "2"
timeago = "0.6"
serde = { version = "1.0", features = ["derive"] }
ico = "0.5"
png = "0.18"
thiserror = "2.0"
tracing = "0.1"
jiff = "0.2.35"
isolang = "2.4.0"
harfrust = "0.12"
base64 = "0.23"
skera = "0.6"
read-fonts = "0.43"

[dev-dependencies]
assert2.workspace = true
criterion = { version = "0.8.2", features = ["html_reports"] }
flate2 = "1.1.9"
rstest.workspace = true
sha2 = "0.10"

[[bench]]
name = "render"
harness = false
