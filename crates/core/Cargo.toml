[package]
name = "time-banner-core"
description = "Value grammar and timezone resolution for time-banner"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "time_banner_core"

[dependencies]
regex = "1.11.1"
phf = { version = "0.14", default-features = false }
thiserror = "2.0"
jiff = { version = "0.2.35", features = ["tzdb-bundle-always"] }

[build-dependencies]
regex = "1.11.1"
phf = { version = "0.14", default-features = false }
phf_codegen = "0.14"
anyhow = "1.0"
