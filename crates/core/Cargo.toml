[package]
name = "time-banner-core"
description = "Value grammar and timezone resolution for time-banner"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "time_banner_core"

[package.metadata.cargo-machete]
# used only via build.rs codegen; cargo-machete can't see that.
ignored = ["phf", "phf_codegen", "anyhow"]

[dependencies]
regex = "1.11.1"
phf = { version = "0.14", default-features = false }
thiserror = "2.0"
jiff = { version = "0.2.35", features = ["tzdb-bundle-always"] }
memmap2 = "0.9.11"

[build-dependencies]
regex = "1.11.1"
phf = { version = "0.14", default-features = false }
phf_codegen = "0.14"
anyhow = "1.0"

[dev-dependencies]
assert2.workspace = true
proptest = "1.11.0"
rstest.workspace = true
