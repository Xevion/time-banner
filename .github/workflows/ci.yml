name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/cache@v4
        with:
          path: crates/render/fonts/*.ttf
          key: fonts-${{ hashFiles('xtask/src/fonts.rs') }}
      - name: Build the face bundle, and check the manifest still describes it
        run: cargo run -p xtask -- fonts --verify
      - uses: taiki-e/install-action@cargo-machete
      - name: Check formatting
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cargo fmt --all -- --check
          else
            cargo fmt --all -- --check || echo "::warning::Formatting issues found (not failing on push)"
          fi
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Unused dependencies
        run: cargo machete

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/cache@v4
        with:
          path: crates/render/fonts/*.ttf
          key: fonts-${{ hashFiles('xtask/src/fonts.rs') }}
      - name: Build the face bundle
        run: cargo run -p xtask -- fonts
      - uses: taiki-e/install-action@cargo-nextest
      - name: Run tests
        run: cargo nextest run

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: time-banner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name time-banner-ci -p 3000:3000 -e ENV=production time-banner:ci
          for i in $(seq 1 10); do
            if curl --fail --silent http://localhost:3000/health; then exit 0; fi
            sleep 1
          done
          docker logs time-banner-ci
          exit 1

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the baseline is scanned from a worktree
      - uses: Xevion/advisory-action@v1
